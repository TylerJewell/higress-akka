akka.javasdk.dev-mode.http-port = 9025

higress {
  # The upstream the gateway dispatches to. In tests this name is mocked; in dev mode
  # it resolves through the SDK's normal service lookup.
  upstream-service = "upstream"

  routing {
    model-key = "model"
    model-header = "x-model"
    provider-header = "x-provider"
    keep-original-model-name = false
    path-suffixes = ["/completions", "/embeddings", "/responses", "/messages"]
    auto-sentinel = "higress/auto"
    auto-header = "x-higress-llm-model"
    auto-default-model = ""
    auto-rules = []
  }

  budget {
    rule-name = "default"
    # Absent global threshold is written as 0.
    global-threshold-tokens = 0
    window-seconds = 60
    # Per-header budgets: header name, header value, ceiling.
    header-rules = []
  }

  dispatch {
    max-retries = 1
    retry-on-status = ["4..", "5.."]
    failure-threshold = 3
    cooldown-millis = 600000
    credentials = ["cred-a", "cred-b", "cred-c"]
    provider-id = "openai"
  }

  rejection {
    status = 429
    message = "Too many tokens consumed, please try again later."
  }
}
